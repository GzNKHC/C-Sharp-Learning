@model ProductFormViewModel
<div asp-validation-summary="ModelOnly" class="field-error" role="alert"></div>
<div class="field"><label asp-for="Name"></label><input asp-for="Name" maxlength="100" /><span asp-validation-for="Name" class="field-error"></span></div>
<div class="field"><label asp-for="Price"></label><input asp-for="Price" type="number" step="0.01" min="0.01" max="1000000000" /><span asp-validation-for="Price" class="field-error"></span></div>
<div class="field"><label asp-for="Description"></label><textarea asp-for="Description" maxlength="2000"></textarea><span asp-validation-for="Description" class="field-error"></span></div>
<div class="field"><label asp-for="CategoryId"></label><select asp-for="CategoryId" asp-items="ViewBag.Categories"><option value="0">-- Chọn danh mục --</option></select><span asp-validation-for="CategoryId" class="field-error"></span></div>
<div class="field"><label asp-for="Image"></label><input asp-for="Image" type="file" accept="image/jpeg,image/png,image/webp" /><span asp-validation-for="Image" class="field-error"></span></div>
<div class="field"><label asp-for="AdditionalImages"></label><input asp-for="AdditionalImages" type="file" accept="image/jpeg,image/png,image/webp" multiple /><span asp-validation-for="AdditionalImages" class="field-error"></span><span class="field-hint">JPG, PNG hoặc WebP, tối đa 5 MB mỗi ảnh; nhiều nhất 6 ảnh bổ sung.</span></div>
